<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Numero 1:</label>
                            <input [(ngModel)]="num1" type="text" name="num1" class="form-control" id="num1" placeholder="Ingrese el primer numero">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Numero 2:</label>
                            <input [(ngModel)]="num2" type="text" name="num2" class="form-control" id="num2" placeholder="Ingrese el segundo numero">
                        </div>
                        <br>
                        <input [(ngModel)]="operacion" type="radio" id="sumar" name="operacion" value="sumar">
                        <label for="sumar">Sumar</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="restar" name="operacion" value="restar">
                        <label for="restar">Restar</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="multiplicar" name="operacion" value="multiplicar">
                        <label for="multiplicar">Multiplicar</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="dividir" name="operacion" value="dividir">
                        <label for="dividir">Dividir</label><br>
                        <br>
                        <button (click)="calcular()" type="button" class="btn btn-primary">Calcular</button>
                        <!--<button (click)="sumar()" type="button" class="btn btn-primary">Sumar</button>
                    <button (click)="restar()" type="button" class="btn btn-primary">Restar</button>                     
                    <button (click)="multiplicar()" type="button" class="btn btn-primary">Multiplicar</button>                     
                    <button (click)="dividir()" type="button" class="btn btn-primary">Dividir</button> -->
                </form>
                </div>
                <div class="col-6">
                <h3>Resultado: {{resultado}}  </h3> 
            </div>
            </div>
        </div>
    </div>
</body>
</html>
