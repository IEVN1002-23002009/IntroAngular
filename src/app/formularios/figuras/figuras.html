<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form action="">
                        <div class="form-group pt-4">
                            <label for="base">Base: </label>
                            <input [(ngModel)]="base" type="text" name="base" class="form-control" id="base" aria-placeholder="Ingrese el primer numero">
                        </div>
                        <div class="form-group pt-4">
                            <label for="altura">Altura: </label>
                            <input [(ngModel)]="altura" type="text" name="altura" class="form-control" id="altura" aria-placeholder="Ingrese el primer numero">
                        </div>
                        <br>
                        <input [(ngModel)]="operacion" type="radio" id="triangulo" name="operacion" value="triangulo">
                        <label for="triangulo">TRIANGULO</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="rectangulo" name="operacion" value="rectangulo">
                        <label for="rectangulo">RECTANGULO</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="circulo" name="operacion" value="circulo">
                        <label for="circulo">CIRCULO</label><br>
                        <input [(ngModel)]="operacion" type="radio" id="pentagono" name="operacion" value="pentagono">
                        <label for="pentagono">PENTAGONO</label><br>
                        <br>
                        <button (click)="calcular()" type="button" class="btn btn-primary">Calcular</button>
                    </form>
                </div>
                <div class="col-6">
                <h3>Resultado: {{resultado}}  </h3> 
                </div>
            </div>
        </div>
    </div>
</body>
</html>
